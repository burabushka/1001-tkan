<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1001 Tkani preview</title>
    <script>
      fetch("/source/index.html")
        .then((response) => response.text())
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
        });
    </script>
